name: Build APK

# 릴리스할 때만 빌드: v로 시작하는 태그를 올릴 때(또는 직접 실행). 풀 리퀘스트로는 돌지 않음
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 빌드 캐시 (의존성·Gradle 결과를 다음 빌드에 재사용)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
          cache-read-only: false

      # 서명 키: GitHub Secrets에서 꺼내 임시 파일로 (로그에 안 찍힘)
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice title=signing::Secrets의 서명 키 사용"
          else
            echo "::warning title=signing::Secrets에 서명 키가 없어 저장소 안 키로 빌드"
          fi

      # 광고 차단 목록(국내·해외)을 받아 앱에 넣는다
      - name: Download ad block lists
        run: |
          out=$(python3 tools/build_filters.py app/src/main/assets/adblock)
          echo "::notice title=adblock::$out"

      - name: Build debug APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
        # 빌드가 실패하면 오류 줄만 골라 요약 표시(annotation)로 남긴다 — 채팅에서 원인을 바로 볼 수 있게
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILURE|Unresolved|Exception" build.log | head -60 > errors.txt || true
          msg=$(sed 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build-errors::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk light-browser.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest light-browser.apk \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "$(printf '폰에서 light-browser.apk를 눌러 받아 설치하세요.\n\n변경 내용:\n%s' "$(git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session')")" \
            --target ${{ github.sha }}
